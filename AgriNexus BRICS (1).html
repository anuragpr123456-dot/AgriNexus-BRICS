<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>AgriNexus BRICS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2e9d6;--card:#fbf6ea;--ln:#dccfae;--tx:#23372a;--mu:#5b5e47;--g:#1f5a3f;--am:#b8862b;--rd:#a5432f;--bl:#3d7a8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 Nunito,system-ui,sans-serif}
h1,h2,h3{color:var(--g);font-family:Fraunces,Georgia,serif;margin:.2em 0;letter-spacing:.3px}h1{font-size:clamp(34px,6vw,60px);line-height:1}h2{font-size:30px}h3{font-size:21px}
#side{position:fixed;left:0;top:0;bottom:0;width:230px;background:var(--card);border-right:1px solid var(--ln);overflow:auto;padding:12px 8px}
#side a{display:block;padding:8px 12px;border-radius:8px;color:var(--mu);text-decoration:none;cursor:pointer}#side a.on,#side a:hover{background:var(--ln);color:var(--tx)}#side h3{color:var(--g)}
#main{margin-left:230px;padding:18px 22px 40px;max-width:1100px}
#bot{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
#bot a{flex:1;text-align:center;padding:9px 2px;font-size:13px;color:var(--mu);cursor:pointer}#bot a b{display:block;font-size:22px}#bot a.on{color:var(--g)}
@media(max-width:800px){#side{display:none}#main{margin:0;padding:14px 12px 90px}#bot{display:flex}}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tag{font:800 13px Fraunces,Georgia,serif;letter-spacing:1px;background:var(--am);color:#fff;padding:2px 8px;border-radius:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;box-shadow:0 10px 22px -16px rgba(20,60,40,.45)}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--g)}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px 14px;max-width:100%}
button{cursor:pointer;background:var(--g);color:#fff;font-weight:700;border:0;min-height:44px}button.alt{background:transparent;color:var(--tx);border:1px solid var(--ln)}
label{display:block;color:var(--mu);font-size:14px;margin:8px 0 2px}input,select{width:100%}
.big{font:800 44px Fraunces,Georgia,serif}.mu{color:var(--mu)}.ok{color:var(--g)}.wn{color:var(--am)}.bd{color:var(--rd)}
.bar{height:10px;background:var(--ln);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.hero{border-radius:18px;padding:34px 22px;background:radial-gradient(circle at 92% 12%,rgba(184,134,43,.22) 0 90px,transparent 92px),radial-gradient(circle at 6% 100%,rgba(31,90,63,.10) 0 150px,transparent 152px),linear-gradient(135deg,#fbf6ea,#efe3c6);border:1px solid var(--ln);color:#3d4a3a}.hero h1{color:var(--g)}.hero p{color:#3d4a3a;font-size:19px}.hero button.alt{border-color:var(--g);color:var(--g)}
.chat{max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:8px 0}.m{padding:10px 12px;border-radius:12px;background:var(--bg);white-space:pre-wrap}.m.u{background:var(--ln);align-self:flex-end}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.row>button{flex:0 0 auto}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9;display:flex;align-items:center;justify-content:center;padding:16px}
.tbl{width:100%;border-collapse:collapse;display:block;overflow-x:auto}.tbl td,.tbl th{padding:8px;border-bottom:1px solid var(--ln);text-align:left}
svg{max-width:100%}pre{overflow-x:auto;background:var(--bg);padding:10px;border-radius:8px;font-size:13px}
</style></head><body>
<div id="side"></div><div id="main"></div><div id="bot"></div>
<script>
// ===== i18n (extend LANGS / T freely; missing keys fall back to English; AI answers in any listed language) =====
const LANGS={en:'English',hi:'हिन्दी',mr:'मराठी',ta:'தமிழ்',te:'తెలుగు',bn:'বাংলা',gu:'ગુજરાતી',kn:'ಕನ್ನಡ',ml:'മലയാളം',pa:'ਪੰਜਾਬੀ',pt:'Português',ru:'Русский',zh:'中文',ar:'العربية',fa:'فارسی',am:'አማርኛ'};
const T={en:{home:'Home',advice:'Crop Advice',dash:'My Farm',advisor:'AI Advisor',doctor:'Crop Doctor',soil:'Soil Health',weather:'Weather',sat:'Satellite',regen:'Regenerative',irrig:'Irrigation',crop:'Crop Picker',market:'Market',brics:'BRICS Network',coop:'Data Cooperation',arch:'Interoperability',hub:'Knowledge Hub',alerts:'Alerts',profile:'Profile',admin:'Officer · Research · Admin',privacy:'Privacy',impact:'Impact',scan:'Scan',good:'Good morning, Farmer',ask:'Ask',today:'What should I do today?'},
hi:{home:'होम',advice:'फसल सलाह',dash:'मेरा खेत',advisor:'AI सलाहकार',doctor:'फसल डॉक्टर',soil:'मिट्टी की सेहत',weather:'मौसम',sat:'उपग्रह',regen:'पुनर्योजी खेती',irrig:'सिंचाई',crop:'फसल चुनें',market:'बाज़ार',brics:'ब्रिक्स नेटवर्क',coop:'डेटा सहयोग',arch:'इंटरऑपरेबिलिटी',hub:'ज्ञान केंद्र',alerts:'अलर्ट',profile:'प्रोफ़ाइल',admin:'अधिकारी · शोध · एडमिन',privacy:'गोपनीयता',impact:'प्रभाव',scan:'स्कैन',good:'सुप्रभात, किसान भाई',ask:'पूछें',today:'आज मुझे क्या करना चाहिए?'},
mr:{home:'मुख्यपृष्ठ',advice:'पीक सल्ला',dash:'माझे शेत',advisor:'AI सल्लागार',doctor:'पीक डॉक्टर',soil:'मातीचे आरोग्य',weather:'हवामान',sat:'उपग्रह',alerts:'सूचना',scan:'स्कॅन',good:'शुभ प्रभात, शेतकरी बंधू',ask:'विचारा',today:'आज मी काय करावे?'}};
const t=k=>(T[S.lang]&&T[S.lang][k])||T.en[k]||k;
// ===== Service layer: swap mock bodies for real API calls behind your backend (no keys in frontend) =====
const DEMOTAG='<span class="tag">DEMO DATA</span>';
const FARMS={IN:{name:'Demo Farm · Nashik',country:'India',state:'Maharashtra',district:'Nashik',village:'Demo village',size:2,crop:'Wheat',stage:'Vegetative',soil:'Black cotton',irr:'Drip',sow:'2026-11-10',harv:'2027-03-25',lat:20.0,lng:73.8,sm:42,rain:70,ph:6.9,N:'Moderate',P:'Medium',K:'High',oc:0.62,st:24},
BR:{name:'Demo Farm · Mato Grosso',country:'Brazil',state:'Mato Grosso',district:'Sorriso',village:'-',size:120,crop:'Soybean',stage:'Flowering',soil:'Red loam',irr:'Rainfed',sow:'2026-10-05',harv:'2027-02-15',lat:-12.5,lng:-55.7,sm:55,rain:60,ph:5.8,N:'Low',P:'Medium',K:'Medium',oc:1.1,st:27},
CN:{name:'Demo Farm · Henan',country:'China',state:'Henan',district:'Zhoukou',village:'-',size:5,crop:'Wheat',stage:'Tillering',soil:'Loam',irr:'Canal',sow:'2026-10-12',harv:'2027-06-01',lat:33.6,lng:114.6,sm:36,rain:25,ph:7.6,N:'Moderate',P:'Low',K:'Medium',oc:0.8,st:15},
ZA:{name:'Demo Farm · Free State',country:'South Africa',state:'Free State',district:'Bethlehem',village:'-',size:40,crop:'Maize',stage:'Vegetative',soil:'Sandy loam',irr:'Rainfed',sow:'2026-11-20',harv:'2027-05-10',lat:-28.2,lng:28.3,sm:31,rain:35,ph:6.2,N:'Low',P:'Low',K:'Medium',oc:0.5,st:26}};
const mk=f=>({...f,demo:true});
const svc={
 weather:f=>({temp:f.country=='India'?27:22,hum:68,wind:12,rain:f.rain,mm:f.rain>50?32:6,days:[0,1,2,3,4,5,6].map(i=>({d:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i],hi:Math.round(29-i*.6+(i%3)),lo:Math.round(16+(i%2)),p:Math.max(5,Math.min(95,f.rain-i*11+(i%2)*8))})),risk:{Drought:f.sm<35?'High':'Low',Flood:f.rain>65?'Medium':'Low','Heat stress':'Low','Heavy rain':f.rain>65?'High':'Low'}}),
 soil:f=>({pH:f.ph,Nitrogen:f.N,Phosphorus:f.P,Potassium:f.K,'Organic carbon %':f.oc,'Moisture %':f.sm,'Temp °C':f.st}),
 soilScore:f=>Math.round(40+Math.min(f.oc,1.2)*20+(7-Math.abs(6.8-f.ph))*4+(f.N=='Low'?0:8)+(f.P=='Low'?0:6)+(f.K=='Low'?0:6)),
 sat:(f,d)=>Array.from({length:Math.round(d/10)+1},(_,i)=>+(0.28+0.5*Math.sin(i/(d/10+1)*Math.PI*.9)+ (i%3)*.01).toFixed(2)),
 irrig:(f,area)=>{const et={Wheat:4.5,Rice:7,Maize:5.5,Soybean:5,Cotton:6}[f.crop]||5,delay=f.rain>=60||f.sm>=50;return{delay,mm:delay?0:Math.round(et*3),litres:delay?0:Math.round(et*3*area*4047),when:delay?'Re-check in 24 h':'Early morning (5–8 am)',why:delay?`Rain chance ${f.rain}% and soil moisture ${f.sm}%`:`Soil moisture ${f.sm}% is low for ${f.stage} stage`}},
 market:c=>({Wheat:[2350,2420,2480],Rice:[2180,2260,2300],Maize:[2050,2120,2200],Soybean:[4600,4720,4850],Cotton:[7000,7150,7300]}[c]||[2000,2100,2150])};
const CROPS=[['Wheat','rabi',6,8,10,25,300,'120–150 days'],['Rice','kharif',5,7,22,35,1000,'110–140 days'],['Maize','kharif',5.5,7.5,18,32,500,'90–110 days'],['Soybean','kharif',6,7.5,20,30,500,'90–120 days'],['Chickpea','rabi',6,8,15,28,250,'95–110 days'],['Millet (Bajra)','kharif',5.5,8,25,38,250,'70–90 days'],['Mustard','rabi',6,8,10,25,250,'110–140 days']];
const COUNTRIES=[['India',22,79,'Wheat, rice, pulses, cotton','Monsoon, semi-arid, Himalayan','Small holdings, water stress','Climate-resilient seeds, soil health cards','Zero-budget natural farming, mulching'],['Brazil',-14,-52,'Soy, maize, sugarcane, coffee','Tropical, cerrado, subtropical','Soil acidity, deforestation pressure','Integrated crop-livestock-forest','No-till, cover crops'],['Russia',55,50,'Wheat, barley, sunflower','Continental, steppe','Short seasons, drought in south','Cold-tolerant cereals','Crop rotation, reduced tillage'],['China',34,105,'Rice, wheat, maize','Monsoon, arid north-west','Land fragmentation, fertilizer overuse','Precision agriculture','Organic fertilizer substitution'],['South Africa',-29,25,'Maize, citrus, sugarcane','Semi-arid, Mediterranean','Drought, smallholder access','Drought-tolerant maize','Conservation agriculture']];
const HUB=[['Crop Management','Wheat sowing window and seed rate basics'],['Soil Health','How to read a soil test in 5 minutes'],['Water Management','Drip vs flood: when each makes sense'],['Pest Management','Integrated pest management for beginners'],['Disease Management','Spotting early blight and leaf rust'],['Regenerative Agriculture','Starting cover crops on small plots'],['Climate-Smart Agriculture','Heat-wave checklist for standing crops'],['Government Schemes','Where to check local scheme eligibility (verify with your office)'],['Farmer Safety','Safe handling and storage of agrochemicals'],['Post-Harvest Management','Drying and storing grain to prevent losses']];
// ===== state =====
const S={lang:'en',farm:null,page:'home',bm:[],cfg:{countries:COUNTRIES.map(c=>c[0]),sms:true,push:true,wa:false,email:false},chat:[]};
const $=s=>document.querySelector(s),P={};
const NAV=['home','advice','doctor','regen','weather','crop','market','brics','alerts'];
const need=()=>S.farm?'':`<div class="card"><h3>No farm yet</h3><p>Load a demo farm to explore the platform.</p><button onclick="loadDemo('IN')">Load India Demo Farm</button> <button class="alt" onclick="loadDemo('BR')">Brazil demo</button> <button class="alt" onclick="loadDemo('CN')">China demo</button> <button class="alt" onclick="loadDemo('ZA')">South Africa demo</button></div>`;
function go(p){S.page=p;location.hash=p;render()}
function loadDemo(k){S.farm=mk(FARMS[k]);S.chat=[];render()}
function render(){$('#side').innerHTML=`<h3 style="padding:6px 12px">🌾 AgriNexus BRICS</h3>`+NAV.map(n=>`<a class="${S.page==n?'on':''}" onclick="go('${n}')">${t(n)}</a>`).join('');
 $('#bot').innerHTML=[['home','🏠','home'],['advice','🌾','advice'],['doctor','📷','scan'],['weather','🌦','weather'],['alerts','🔔','alerts']].map(a=>`<a class="${S.page==a[0]?'on':''}" onclick="go('${a[0]}')"><b>${a[1]}</b>${t(a[2])}</a>`).join('');
 const top=`<div class="top">${S.farm?'<span class="tag">DEMO MODE</span>':''}<select style="width:auto" onchange="S.lang=this.value;render()">${Object.entries(LANGS).map(([k,v])=>`<option value="${k}" ${k==S.lang?'selected':''}>${v}</option>`).join('')}</select><button class="alt" onclick="tour(0)">▶ Start Smart Farm Demo</button></div>`;
 $('#main').innerHTML=top+(P[S.page]||P.home)();(P['$'+S.page]||(()=>{}))();scrollTo(0,0)}
const kv=(k,v,c='')=>`<div class="card"><div class="mu">${k}</div><div class="big ${c}">${v}</div></div>`;
const col=v=>v=='High'?'bd':v=='Medium'?'wn':'ok';
function line(d,c='var(--g)',w=520,h=140){const mx=Math.max(...d),mn=Math.min(...d),x=i=>10+i*(w-20)/(d.length-1||1),y=v=>h-14-(v-mn)/(mx-mn||1)*(h-30);return `<svg viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="${c}" stroke-width="3" points="${d.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>${d.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${c}"/>`).join('')}</svg>`}
function bars(d,l,c='var(--bl)',h=120){const mx=Math.max(...d,1),w=520,bw=w/d.length;return `<svg viewBox="0 0 ${w} ${h+20}">${d.map((v,i)=>`<rect x="${i*bw+8}" y="${h-v/mx*h+4}" width="${bw-16}" height="${v/mx*h}" rx="4" fill="${c}"/><text x="${i*bw+bw/2}" y="${h+17}" font-size="12" text-anchor="middle" fill="var(--mu)">${l[i]}</text>`).join('')}</svg>`}
function gauge(v,max,label){const p=Math.min(v/max,1);return `<div class="card"><div class="mu">${label}</div><div class="big">${v}</div><div class="bar"><i style="width:${p*100}%"></i></div></div>`}
// ===== pages =====
P.home=()=>`<div class="hero"><h1>Smarter Farming.<br>Stronger Communities.<br>Connected Nations.</h1><p>Practical agricultural intelligence for farmers across India and BRICS nations.</p><div class="row"><button onclick="go('advice')">Get Started</button><button class="alt" onclick="go('brics')">Explore Platform</button><button onclick="go('advice')">I'm a Farmer</button><button class="alt" onclick="go('brics')">Explore Data Network</button></div></div>
<h2 style="margin-top:20px">One platform. Multiple agricultural challenges.</h2><div class="grid">${[['🌾','Crop Advice by State','advice'],['🌿','Regenerative Farming','regen'],['🌦','Weather & Climate Intelligence','weather'],['📷','Crop Doctor','doctor']].map(c=>`<div class="card click" onclick="go('${c[2]}')"><div class="big">${c[0]}</div><h3>${c[1]}</h3></div>`).join('')}</div>
<h2 style="margin-top:20px">Problem → Solution</h2><div class="grid">${[['Limited agricultural intelligence','Crop Advice by State & District','advice'],['Unpredictable weather','Climate & Weather Intelligence','weather'],['Late disease detection','Crop Doctor','doctor'],['Traditional-only decisions','Data-driven Crop Planning','crop'],['Few regenerative practices','Regenerative Farm Planner','regen'],['Fragmented data','Interoperable BRICS Agri Network','brics']].map(c=>`<div class="card click" onclick="go('${c[2]}')"><span class="bd">${c[0]}</span><br>↓<br><b class="ok">${c[1]}</b></div>`).join('')}</div>
<div class="card" style="margin-top:16px">🔒 <b>Your data, your control.</b> Farmers own their data, we ask only for what advice needs, and only anonymised, aggregated data is shared across borders.</div><p class="mu" style="margin-top:16px">${DEMOTAG} All farm data, satellite values, prices and metrics in this prototype are synthetic unless labelled otherwise.</p>`;
let dis=[];
P.doctor=()=>`<h2>${t('doctor')}</h2><p class="mu">Estimate only. Consult an agricultural expert for confirmation.</p><div class="card"><input type="file" id="img" accept="image/*" capture="environment"><div class="row" style="margin-top:8px"><button onclick="$('#img').click()">Upload Leaf Image / Take Photo</button></div><div id="dres"></div></div><h3 style="margin-top:14px">Disease history</h3><div id="dh">${dis.map(d=>`<div class="card">${d}</div>`).join('')||'<p class="mu">No scans yet.</p>'}</div>`;
P.$doctor=()=>{$('#img').onchange=async e=>{const fl=e.target.files[0];if(!fl)return;const box=$('#dres');box.innerHTML=`<img src="${URL.createObjectURL(fl)}" style="max-width:260px;border-radius:10px"><p>Analysing…</p>`;let txt;
 {txt='DEMO ANALYSIS (live image AI unavailable)\nCROP DETECTED: Tomato (demo)\nPOSSIBLE DISEASE: Early Blight\nSEVERITY: Moderate\nCONFIDENCE: 87% (illustrative)\nSYMPTOMS: Brown concentric spots on lower leaves\nRECOMMENDED ACTION: Remove severely affected leaves; improve ventilation\nPREVENTION: Rotate crops, avoid overhead watering\nWHEN TO CONTACT AN EXPERT: If spots spread within 3 days\nEstimate — consult an agricultural expert for confirmation.'}
 box.innerHTML=`<img src="${URL.createObjectURL(fl)}" style="max-width:260px;border-radius:10px"><pre style="white-space:pre-wrap">${txt.replace(/</g,'&lt;')}</pre>`;dis.unshift(new Date().toDateString()+': '+(txt.match(/DISEASE:\s*(.*)/i)||[,'scan'])[1]);}};
async function dl(name,data){try{const d=await claude.use('downloads');if(!d)throw 0;await d.save({filename:name,data})}catch(e){if(e&&e.code=='declined')return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=name;a.click()}}
P.weather=()=>{const f=S.farm;if(!f)return need();const w=svc.weather(f);return `<h2>${t('weather')}</h2><p>${DEMOTAG} Not a live forecast.</p><div class="grid">${kv('Temp',w.temp+'°C')}${kv('Rainfall',w.mm+' mm')}${kv('Humidity',w.hum+'%')}${kv('Wind',w.wind+' km/h')}${kv('Rain chance',w.rain+'%','wn')}</div>
<div class="grid" style="margin-top:12px"><div class="card"><h3>7-day rain probability %</h3>${bars(w.days.map(d=>d.p),w.days.map(d=>d.d))}</div><div class="card"><h3>Climate risk</h3>${Object.entries(w.risk).map(([k,v])=>`<p>${k}: <b class="${col(v)}">● ${v}</b></p>`).join('')}</div><div class="card"><h3>What to do</h3>${w.rain>65?'<p class="wn">Heavy rain expected in 48 h</p><ul><li>Avoid irrigation</li><li>Delay fertilizer</li><li>Check drainage</li><li>Protect harvested produce</li></ul>':'<ul><li>Normal irrigation schedule</li><li>Watch for heat in afternoons</li></ul>'}</div></div>`};
let rp=null;
P.regen=()=>`<h2>${t('regen')}</h2><p class="mu">Practices that rebuild soil and save water. Indicators are qualitative guides, not measured results.</p><div class="grid">${[['🔄','Crop rotation','Alternate cereals with pulses to restore nitrogen'],['🌱','Cover crops','Keep soil covered in the off-season'],['♻','Composting','Turn farm waste into soil food'],['🍂','Mulching','Cuts evaporation and weeds'],['🚜','Reduced tillage','Protects soil structure and carbon'],['🌳','Agroforestry','Trees for shade, fodder and windbreak'],['💧','Water conservation','Rainwater harvesting, drip, field bunds'],['🐞','Integrated pest management','Scout first, spray last']].map(x=>`<div class="card"><div class="big">${x[0]}</div><b>${x[1]}</b><br><span class="mu">${x[2]}</span></div>`).join('')}</div>
<div class="card" style="margin-top:14px"><h3>Regenerative Farm Planner</h3><div class="grid"><div><label>Current crop</label><select id="rc">${['Wheat','Rice','Maize','Soybean','Cotton'].map(x=>`<option ${S.farm&&S.farm.crop==x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Soil condition</label><select id="rs"><option>Degraded</option><option selected>Average</option><option>Good</option></select></div><div><label>Water availability</label><select id="rw"><option>Scarce</option><option selected>Moderate</option><option>Plenty</option></select></div><div><label>Climate</label><select id="rl"><option>Dry</option><option selected>Mixed</option><option>Humid</option></select></div><div><label>Farm size (ha)</label><input id="ra" type="number" value="${S.farm?S.farm.size:2}"></div></div><button style="margin-top:10px" onclick="planReg()">Generate plan</button><div id="rr">${rp||''}</div></div>`;
function planReg(){const c=$('#rc').value,sd=$('#rs').value=='Degraded',ws=$('#rw').value=='Scarce',dry=$('#rl').value=='Dry',hu=$('#rl').value=='Humid';
